name: flutter_version
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+22

environment:
  sdk: ^3.6.1

dependencies:
  audioplayers: ^5.2.1
  cached_network_image: ^3.3.1
  chewie: ^1.8.1
  cupertino_icons: ^1.0.8
  device_info_plus: ^11.3.0
  dio: ^5.4.0
  encrypt: ^5.0.1
  # firebase_core: ^3.10.1
  # firebase_messaging: ^15.2.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^17.2.3
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  flutter_sound: ^9.2.13
  google_fonts: ^6.2.1
  http: ^1.4.0
  image_picker: ^1.1.2
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  phosphoricons_flutter: ^1.0.0
  photo_view: ^0.15.0
  provider: ^6.1.2
  share_plus: ^10.0.0
  shared_preferences: ^2.5.3
  socket_io_client: ^3.1.2
  syncfusion_flutter_pdf: ^29.1.38
  syncfusion_flutter_pdfviewer: ^29.1.38
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  video_player: ^2.10.0
  web_socket_channel: ^2.4.0
  webview_windows: ^0.4.0
  youtube_player_iframe:
    git:
      url: https://github.com/coursesapp/youtube_player_iframe-5.2.1.git
      ref: main

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon.png

# ✅ Force all packages to use your local version of flutter_inappwebview
# dependency_overrides:
#   flutter_inappwebview:
#     path: plugins/flutter_inappwebview
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/videos/
    - assets/pdf_editor/
    - assets/pdf_editor/libs/
    - assets/images/emojis/
